name: agentic-research-hub

services:
  research-net:
    image: docker.io/library/alpine:3.20
    command: ["true"]
    networks: [research-net]
    profiles: [network-init]

  forgejo:
    image: ${FORGEJO_IMAGE:-codeberg.org/forgejo/forgejo:10}
    container_name: forgejo
    environment:
      USER_UID: ${PUID:-1000}
      USER_GID: ${PGID:-1000}
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__server__ROOT_URL: http://localhost:18082/
      TZ: ${TZ:-UTC}
    volumes:
      - ${STATE_HOST_PATH:-./service-state}/forgejo:/data
      - ${VAULT_HOST_PATH:-./research-vault}:/data/git/repositories/research-vault.git
    networks: [research-net]
    ports:
      - "127.0.0.1:18082:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  silverbullet:
    profiles: [legacy-silverbullet]
    image: ${SILVERBULLET_IMAGE:-docker.io/zefhemel/silverbullet:latest}
    container_name: silverbullet
    environment:
      SB_USER: ${SILVERBULLET_USER:-admin:change-me}
      TZ: ${TZ:-UTC}
    volumes:
      - ${VAULT_HOST_PATH:-./research-vault}:/space
    networks: [research-net]
    ports:
      - "127.0.0.1:18084:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/.ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  hub-api:
    build:
      context: ./services/hub-api
    image: ${HUB_API_IMAGE:-agentic-research-hub/hub-api:dev}
    container_name: hub-api
    environment:
      VAULT_PATH: /vault
      BLOBS_PATH: /blobs
      STATE_PATH: /state
      AGENT_API_KEY: ${AGENT_API_KEY:-change-me}
      WEB_PASSWORD: ${WEB_PASSWORD:-change-me-web}
      SESSION_SECRET: ${SESSION_SECRET:-}
      FORGEJO_URL: ${FORGEJO_URL:-http://forgejo:3000}
      FORGEJO_PUBLIC_URL: ${FORGEJO_PUBLIC_URL:-}
      FORGEJO_TOKEN: ${FORGEJO_TOKEN:-}
      FORGEJO_OWNER: ${FORGEJO_OWNER:-}
      FORGEJO_REPO: ${FORGEJO_REPO:-research-vault}
      FORGEJO_GIT_REMOTE: ${FORGEJO_GIT_REMOTE:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ${VAULT_HOST_PATH:-./research-vault}:/vault
      - ${BLOBS_HOST_PATH:-./research-blobs}:/blobs
      - ${STATE_HOST_PATH:-./service-state}/hub-api:/state
    networks: [research-net]
    ports:
      - "127.0.0.1:18081:8000"
      - "127.0.0.1:18083:8000"
    depends_on:
      forgejo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/healthz | grep -q 'ok'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  research-net:
    name: research-net
    driver: bridge
    internal: true
