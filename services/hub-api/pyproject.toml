[project]
name = "agentic-research-hub-api"
version = "0.1.0"
description = "Git-first research vault API and MCP gateway"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "PyYAML>=6.0", "httpx>=0.27", "python-multipart>=0.0.9"]

[project.scripts]
hub-api = "hub_api.main:run"
